<script>
const SIZE=7, TOTAL=100;
const chapters=[
 ['Die ersten Schritte','Befehle der Reihe nach'],['Abbiegen lernen','Rechts und links drehen'],['Sternensammler','Werte einsammeln'],['Wiederholungen','Schleifen sparen Tipparbeit'],['Clever entscheiden','Bedingungen prüfen'],['Schleifen auf Tour','Wiederholen und abbiegen'],['Der Hinderniswald','Wege planen'],['Kristall-Express','Schleifen und Bedingungen kombinieren'],['Lange Expedition','Mehrere Schritte vorausplanen'],['Meisterprüfung','Alles zusammen einsetzen']
];
const miniLessons=[
 ["Ein Befehl ist eine Anweisung. move() sagt Robo, ein Feld vorwärtszugehen.","Python liest Befehle von oben nach unten. Darum ist die Reihenfolge wichtig.","Die Klammern () zeigen: Hier wird eine Funktion aufgerufen, also eine Aktion gestartet.","left() und right() ändern Robos Blickrichtung. Sie bewegen ihn noch kein Feld.","Ein Befehl pro Zeile macht ein Programm leichter lesbar.","Python unterscheidet Groß- und Kleinschreibung: move() und Move() sind verschieden.","Ein Programm ist eine genaue Schrittfolge, die der Computer ausführt.","Eine leere Klammer wie move() bedeutet: Die Aktion braucht hier keine zusätzliche Angabe.","Mit # beginnt ein Kommentar. Python überspringt den Kommentar beim Ausführen.","Ein Algorithmus ist ein Plan aus klaren Schritten, mit dem man ein Ziel erreicht."],
 ["Robo startet nach rechts blickend. Seine Richtung bestimmt, wohin move() geht.","Nach left() zeigt Robo eine Vierteldrehung nach links.","Nach right() zeigt Robo eine Vierteldrehung nach rechts.","Drehen und Gehen sind zwei getrennte Befehle. Für eine Kurve brauchst du beides.","Zwei move()-Befehle hintereinander bringen Robo zwei Felder weit.","collect() funktioniert nur, wenn Robo auf einem Kristall steht.","Man kann einen Weg in Abschnitte zerlegen: geradeaus, drehen, wieder geradeaus.","Ein Ziel kann an unterschiedlichen Stellen liegen. Lies darum jedes Spielfeld neu.","Befehle wirken nacheinander auf Robos aktuelle Position und Richtung.","Vor dem Start hilft es, den Weg mit den Augen Schritt für Schritt abzufahren."],
 ["Eine Schleife wiederholt Befehle. So muss man move() nicht immer neu schreiben.","for i in range(3): wiederholt den eingerückten Teil genau dreimal.","Die Zahl in range(4) gibt an, wie oft die Schleife läuft.","Der Doppelpunkt : kündigt bei Python einen eingerückten Block an.","Die eingerückte Zeile gehört zur Schleife. Ohne Einrückung gehört sie nicht dazu.","i ist eine Zählvariable: Python zählt damit die Wiederholungen.","range(1) läuft einmal; range(5) läuft fünfmal.","Auch mehrere Befehle können in einer Schleife stehen.", "Schleifen machen lange, gleiche Wege kürzer und übersichtlicher.","range() beginnt intern bei 0. Trotzdem bedeutet range(3): drei Durchläufe."],
 ["In einer Schleife dürfen mehrere Befehle stehen, nicht nur move().", "Die Einrückung zeigt genau, welche Befehle bei jeder Wiederholung laufen.","Wenn Robo bei jeder Wiederholung abbiegt, wiederholt sich ein ganzes Muster.","Die Befehle im Schleifenblock laufen jedes Mal in derselben Reihenfolge.","Ein Muster wie vorwärts, rechts, vorwärts kann mehrfach wiederholt werden.","Ein turn-Befehl in einer Schleife ändert Robos Richtung für den nächsten Schritt.","Nach der letzten Wiederholung geht Python mit dem nächsten nicht eingerückten Befehl weiter.","Eine Schleife spart Tipparbeit, aber die Wiederholungszahl muss zum Weg passen.","Man kann Schleifen am Spielfeld prüfen, indem man einen Durchlauf nach dem anderen verfolgt.","Fehlt ein Schritt, prüfe zuerst die Zahl hinter range()."],
 ["if bedeutet „wenn“. Python führt den eingerückten Block nur aus, wenn die Prüfung stimmt.","on_gem() prüft, ob Robo gerade auf einem Kristall steht.","Eine Bedingung kann wahr oder falsch sein.","Der Doppelpunkt nach if beginnt den Bedingungsblock.","Die eingerückte Aktion gehört zur if-Bedingung.","if on_gem(): collect() sammelt nur dann, wenn dort wirklich ein Kristall liegt.","Eine Bedingung wird genau an der Stelle geprüft, an der Python sie erreicht.","Steht if nach den Bewegungen, wird erst nach diesen Bewegungen geprüft.","Mit einer Bedingung kann ein Programm passend auf das Spielfeld reagieren.","Eine richtige Bedingung verhindert, dass Robo an einem leeren Feld sammeln will."],
 ["Eine if-Bedingung kann innerhalb einer Schleife stehen.","Dann prüft Python die Bedingung bei jeder Wiederholung erneut.","So kann Robo auf einem langen Weg jedes Mal nach einem Kristall suchen.","Die Einrückung zeigt, ob if zur Schleife gehört oder erst danach kommt.","Ein eingerücktes if im eingerückten for-Block braucht eine weitere Einrückung.","Die Schleife wiederholt den ganzen inneren Block, einschließlich der Prüfung.","Wenn die Bedingung falsch ist, überspringt Python nur den if-Block und macht weiter.","Reihenfolge zählt: erst zum Feld gehen, dann dort prüfen und einsammeln.","Ein Programm kann Wiederholung und Entscheidung miteinander verbinden.","Wenn Robo einen Kristall übersieht, prüfe die Position von if im Schleifenblock."],
 ["Ein Hindernis ist ein Feld, auf das Robo nicht gehen kann.","Plane bei einem Hindernis eine Kurve und prüfe danach erneut Robos Richtung.","Ein Syntaxfehler bedeutet: Python versteht die Schreibweise nicht.","Ein Logikfehler bedeutet: Der Code läuft, führt aber zum falschen Ziel.","Bei einem Fehler hilft es, den letzten richtigen Schritt zu finden.","Robo bewegt sich auf einem Raster: Jede Bewegung ändert eine Feldposition.","Eine Wand kann nicht durch move() überwunden werden.","Ein guter Plan vermeidet Hindernisse, bevor das Programm startet.","Das Spielfeld ist eine Karte mit Zeilen und Spalten.","Ein Programm zu verbessern heißt oft: kleine Änderungen machen und erneut ausführen."],
 ["Eine Schleife kann mehrere Kristalle auf einem langen Weg einsammeln.","if on_gem() prüft den Ort, collect() führt die Aktion aus.","Die Prüfung und die Aktion haben unterschiedliche Aufgaben.","Wenn eine Bedingung in der Schleife steht, gilt sie für jeden besuchten Ort.","Die Schleife muss weit genug laufen, damit Robo alle Zielstellen erreicht.","Eine zu große range-Zahl kann Robo über das Ziel hinausführen.","Ein verschachtelter Block ist Code innerhalb eines anderen eingerückten Blocks.","Lies verschachtelten Code von außen nach innen: erst for, dann if, dann Aktion.","Mehrere Kristalle brauchen mehrere erfolgreiche Prüfungen und Sammlungen.","Ein gutes Programm erledigt alle Aufgaben und endet am Ziel."],
 ["Bei langen Wegen hilft ein Plan: Welche Abschnitte wiederholen sich?","Gleiche Bewegungsfolgen sind gute Kandidaten für eine Schleife.","Ein Programm kann aus einfachen Bausteinen eine schwierige Route zusammensetzen.","Prüfe jede Kurve, bevor du den nächsten move()-Befehl planst.","Ein Testlauf zeigt, wie dein Plan wirklich auf dem Spielfeld wirkt.","Wenn Robo falsch abbiegt, ändere zuerst den Drehbefehl und beobachte erneut.","Ein verständlicher Code ist leichter zu verbessern als eine unübersichtliche Befehlsfolge.","Python führt nicht aus, was man meint, sondern genau das, was man geschrieben hat.","Das Wort Algorithmus beschreibt eine klare Lösung in einzelnen Schritten.","Eine gute Lösung ist korrekt und so einfach, dass man sie gut erklären kann."],
 ["Du kannst jetzt Befehle, Reihenfolge, Schleifen und Bedingungen zusammen einsetzen.","Vor dem Programmieren: Start, Ziel, Kristalle und Hindernisse genau ansehen.","Wähle eine Schleife nur, wenn sich ein Abschnitt sinnvoll wiederholt.","Setze eine Bedingung dort ein, wo die Prüfung gebraucht wird.","Jeder Doppelpunkt braucht einen eingerückten Block.","Wenn ein Programm nicht klappt, ändere eine Sache auf einmal.","Lies deinen Code nach dem Schreiben noch einmal von oben bis unten.","Ein Computer ist sehr genau: Auch ein kleiner Schreibfehler kann wichtig sein.","Programmieren heißt planen, ausprobieren, Fehler finden und verbessern.","Geschafft: Du hast aus Python-Bausteinen einen eigenen Lösungsweg gebaut."]
];
function randomFor(seed){let state=(seed*1664525+1013904223)>>>0;return()=>{state=(state*1664525+1013904223)>>>0;return state/4294967296}}
function makeLevel(n,salt=0){
 const chapter=Math.floor((n-1)/10),offset=(n-1)%10,rng=randomFor(n*7919+salt*104729),rand=max=>Math.floor(rng()*max),shuffle=a=>a.map(v=>[rng(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 let start=[0,3],x=start[0],y=start[1],heading=0,actions=[],path=[start.slice()];
 const act=cmd=>{actions.push(cmd);if(cmd==='right()'||cmd==='turn_right()')heading=(heading+1)%4;else if(cmd==='left()'||cmd==='turn_left()')heading=(heading+3)%4;else if(cmd==='move()'){x+=[1,0,-1,0][heading];y+=[0,1,0,-1][heading];path.push([x,y])}};
 const forward=count=>{for(let i=0;i<count;i++)act('move()')},turn=side=>act(side+'()');
 let repeatCount=2+offset%3;
 if(n===1)forward(1);
 else if(n===2){start=[0,3];x=0;y=3;path=[start.slice()];forward(1);turn('left');forward(2)}
 else if(chapter===0){const patterns=[['move()','right()','move()'],['move()','left()','move()','move()'],['move()','right()','move()','move()','left()','move()'],['move()','left()','move()','move()','right()','move()'],['move()','right()','move()','left()','move()','move()'],['move()','left()','move()','right()','move()','move()'],['move()','right()','move()','move()','right()','move()'],['move()','left()','move()','move()','left()','move()']];for(const c of patterns[(offset-1)%patterns.length])act(c)}
 else if(chapter===1){start=[0,1+rand(3)];x=start[0];y=start[1];path=[start.slice()];const a=1+offset%3,b=1+offset%3,c=1+(offset*2)%3;forward(a);turn('right');forward(b);turn('left');forward(c)}
 else if(chapter===2){start=[0,1+rand(5)];x=start[0];y=start[1];path=[start.slice()];repeatCount=3+offset%4;forward(repeatCount)}
 else if(chapter===3||chapter===5||chapter===7||chapter===9){start=[0,1+rand(2)];x=0;y=start[1];path=[start.slice()];repeatCount=2+offset%3;for(let i=0;i<repeatCount;i++){forward(1);turn('right');forward(1);turn('left')}}
 else if(chapter===4){start=[0,1+rand(5)];x=0;y=start[1];path=[start.slice()];forward(4+offset%3)}
 else if(chapter===6){start=[0,2+rand(3)];x=0;y=start[1];path=[start.slice()];const a=2+offset%2,b=1+offset%2,c=1+offset%2;forward(a);turn('right');forward(b);turn('left');forward(c);turn('left');forward(1);turn('right')}
 else if(chapter===8){start=[0,1+rand(2)];x=0;y=start[1];path=[start.slice()];const a=1+offset%2,b=1+offset%3,c=1+(offset+1)%2;forward(a);turn('right');forward(b);turn('left');forward(c);turn('right');forward(Math.min(6-y,1+offset%2))}
 const gems=[],inner=path.slice(1,-1),gemCount=chapter<1?0:chapter===1||chapter===4?1:chapter===5?1:chapter===7?Math.min(3,inner.length):chapter>=8?Math.min(2,inner.length):0;
 while(gems.length<gemCount&&inner.length){const k=rand(inner.length);gems.push(inner.splice(k,1)[0])}
 const occupied=new Set(path.map(p=>p.join(','))),free=[];for(let yy=0;yy<SIZE;yy++)for(let xx=0;xx<SIZE;xx++)if(!occupied.has(`${xx},${yy}`))free.push([xx,yy]);const obstacleCount=Math.min(free.length,chapter===0?offset%3:1+Math.floor(chapter*1.15)+offset%3),walls=shuffle(free).slice(0,obstacleCount).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);gems.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
 const needsLoop=chapter===2||chapter===3||chapter>=5,needsIf=chapter===4||chapter===5||chapter===7||chapter>=8;
 let loopSnippet='';if(chapter===2)loopSnippet=`for i in range(${repeatCount}):\n    move()`;else if(chapter===3||chapter===5||chapter===7||chapter===9)loopSnippet=`for i in range(${repeatCount}):\n    move()\n    right()\n    move()\n    left()`;else if(needsLoop)loopSnippet=`for i in range(${repeatCount}):\n    move()`;
 const titleBase=chapter===0?'Robo lernt laufen':chapter===1?'Kurven und Kristalle':chapter===2?'Die erste Schleife':chapter===3?'Schleife um die Ecke':chapter===4?'Wenn Robo Kristall sieht':chapter===5?'Kristall-Kurven':chapter===6?'Hindernis-Labyrinth':chapter===7?'Kristall-Express':chapter===8?'Expedition mit Regeln':'Python-Meisterprüfung';
 const tip=needsIf?'Tipp: Prüfe mit if on_gem():, ob Robo auf einem Kristall steht.':needsLoop?'Tipp: Wiederhole den eingerückten Bewegungsablauf mit for i in range(...):.':gems.length?'Tipp: Führe collect() genau dann aus, wenn Robo auf einem Kristall steht.':n===1?'Tippe move() ein und starte das Programm.':'Robo startet mit Blick nach rechts. Mit left() dreht er nach links.';
 const lesson=miniLessons[n-1];
 if(needsIf&&(chapter===5||chapter===7||chapter===9)){loopSnippet=`for i in range(${repeatCount}):\n    move()\n    if on_gem():\n        collect()\n    right()\n    move()\n    if on_gem():\n        collect()\n    left()`}
 const tools=[['⬆️ Vorwärts','move()'],['↪️ Rechts drehen','right()'],['↩️ Links drehen','left()']];if(gems.length)tools.push(['💎 Sammeln','collect()']);if(needsLoop)tools.push(['🔁 Schleife',loopSnippet]);if(needsIf)tools.push(['🧠 if Kristall','if on_gem():\n    collect()']);
 return {n,chapter,offset,start,goal:path[path.length-1],actions,gems,walls,path,needsLoop,needsIf,title:`${titleBase} · Level ${n}`,tip,lesson,tools,repeatCount,loopSnippet};
}
const levelSignatures=new Set();const levels=Array.from({length:TOTAL},(_,i)=>{let l,sig,salt=0;do{l=makeLevel(i+1,salt++);sig=JSON.stringify([l.start,l.goal,l.walls,l.gems])}while(levelSignatures.has(sig));levelSignatures.add(sig);return l});
function safeGet(key,fallback){try{return localStorage.getItem(key)??fallback}catch{return fallback}}function safeSet(key,value){try{localStorage.setItem(key,String(value))}catch{}}
let levelIndex=Math.min(TOTAL-1,Math.max(0,Number(safeGet('pythonPathLevelV2','0')))),stars=Number(safeGet('pythonPathStars','0')),done=false,running=false,position,heading=0,collected=new Set();
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));$('#stars').textContent=stars;
function syntaxForLevel(l){let s='move()';if(l.n>=2)s+='   left()   right()';if(l.chapter>=1)s+='   collect()';if(l.chapter>=2)s+='\nfor i in range(3):\n    move()';if(l.chapter>=4)s+='\nif on_gem():\n    collect()';if(l.chapter>=5)s+='\nfor i in range(3):\n    move()\n    if on_gem():\n        collect()';return s}
function render(){const l=levels[levelIndex];position=[...l.start];heading=0;collected=new Set();done=false;running=false;$('#title').textContent=l.title;$('#subtitle').textContent=`Mission ${l.n} · Robo muss mehr können als im Level davor.`;$('#chapter').textContent=`Abenteuer ${l.chapter+1} · ${chapters[l.chapter][0]}`;$('#levelTag').textContent=`Level ${l.n} von ${TOTAL}`;$('#miniTag').textContent=`Wissen ${l.n} von ${TOTAL}`;$('#progress').style.width=`${(l.n/TOTAL)*100}%`;$('#mission').textContent=`Bring Robo zum Stern${l.gems.length?' und sammle alle Kristalle':''}.`;$('#help').textContent=l.tip;$('#lesson').textContent=`Level ${l.n}: ${l.lesson}`;$('#syntax').textContent=syntaxForLevel(l);$('#notice').className='notice';$('#notice').textContent='';$('#next').classList.remove('show');
 $('#board').innerHTML='';for(let yy=0;yy<SIZE;yy++)for(let xx=0;xx<SIZE;xx++){const t=document.createElement('div');t.className='tile';if(l.walls.some(([wx,wy])=>wx===xx&&wy===yy)){t.classList.add('wall');t.textContent='🪨'}else if(l.goal[0]===xx&&l.goal[1]===yy){t.classList.add('goal');t.textContent='⭐'}else if(l.gems.some(([gx,gy])=>gx===xx&&gy===yy))t.textContent='💎';if(l.start[0]===xx&&l.start[1]===yy){t.classList.add('robot');t.innerHTML='<span class="robot-piece">🤖</span>'}$('#board').append(t)}
 $('#tools').innerHTML='';l.tools.forEach(([label,snippet])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>insertSnippet(snippet);$('#tools').append(b)});}
function insertSnippet(snippet){const el=$('#code');if(running)return;const focused=document.activeElement===el,start=focused?el.selectionStart:el.value.length,end=focused?el.selectionEnd:el.value.length,before=el.value.slice(0,start),after=el.value.slice(end);let prefix=before&& !before.endsWith('\n')?'\n':'';if(prefix&&before.endsWith('    '))prefix='';const text=prefix+snippet+'\n';el.value=before+text+after;el.focus();const cursor=(before+text).length;el.setSelectionRange(cursor,cursor)}
function parseProgram(source){const lines=source.replace(/\t/g,'    ').split(/\r?\n/).map((raw,i)=>({text:raw.trim(),indent:raw.match(/^ */)[0].length,line:i+1})).filter(x=>x.text&&!x.text.startsWith('#'));let idx=0;
 function block(indent,depth=0){if(depth>8)throw Error('Die Verschachtelung ist zu tief.');const out=[];while(idx<lines.length){const item=lines[idx];if(item.indent<indent)break;if(item.indent>indent)throw Error(`Zeile ${item.line}: Prüfe die Einrückung.`);idx++;let m;
 if((m=item.text.match(/^for\s+i\s+in\s+range\((\d{1,2})\):$/))){const count=Number(m[1]);if(count<1||count>20)throw Error(`Zeile ${item.line}: Nutze für range eine Zahl von 1 bis 20.`);if(idx>=lines.length||lines[idx].indent<=indent)throw Error(`Zeile ${item.line}: Rücke den Schleifeninhalt vier Leerzeichen ein.`);const body=block(lines[idx].indent,depth+1);out.push({kind:'loop',count,body});continue}
 if(item.text==='if on_gem():'){if(idx>=lines.length||lines[idx].indent<=indent)throw Error(`Zeile ${item.line}: Rücke den Inhalt der if-Bedingung vier Leerzeichen ein.`);const body=block(lines[idx].indent,depth+1);out.push({kind:'ifgem',body});continue}
 if(['move()','left()','right()','turn_right()','turn_left()','collect()'].includes(item.text)){out.push({kind:'cmd',name:item.text});continue}
 throw Error(`Zeile ${item.line}: „${item.text}“ kenne ich noch nicht. Nutze einen Befehl aus der Liste.`)}return out}
 const tree=block(0);if(idx<lines.length)throw Error(`Zeile ${lines[idx].line}: Prüfe die Einrückung.`);function cost(nodes){return nodes.reduce((sum,node)=>sum+(node.kind==='loop'?node.count*cost(node.body):node.kind==='ifgem'?cost(node.body):1),0)}if(cost(tree)>150)throw Error('Das Programm ist sehr lang. Teile es in kleinere Schritte auf.');return tree;
}
async function run(){if(done||running)return;const l=levels[levelIndex];let program;try{program=parseProgram($('#code').value)}catch(e){fail('🛠️ '+e.message);return}const codeText=$('#code').value;if(l.needsLoop&&!/^\s*for\s/m.test(codeText)){fail('🔁 Dieses Level übt Schleifen. Probiere for i in range(...):');return}if(l.needsIf&&!/^\s*if on_gem\(\):/m.test(codeText)){fail('🧠 Dieses Level übt Bedingungen. Probiere if on_gem():');return}
 render();running=true;$('#run').disabled=true;$('#reset').disabled=true;let error='';
 async function execute(nodes){for(const node of nodes){if(error)return;if(node.kind==='loop'){for(let j=0;j<node.count&&!error;j++)await execute(node.body)}else if(node.kind==='ifgem'){if(l.gems.some(([gx,gy])=>gx===position[0]&&gy===position[1])&&!collected.has(`${position[0]},${position[1]}`))await execute(node.body)}else if(['right()','turn_right()','left()','turn_left()'].includes(node.name)){heading=(heading+(node.name==='right()'||node.name==='turn_right()'?1:3))%4;const bot=$('.robot-piece');if(bot)bot.style.transform=`rotate(${heading*90}deg)`;await sleep(260)}else if(node.name==='collect()'){const key=`${position[0]},${position[1]}`;if(l.gems.some(([gx,gy])=>gx===position[0]&&gy===position[1])){collected.add(key);robotAt(...position).classList.add('sparkle');$('#mission').textContent='Glitzer! Kristall eingesammelt!';await sleep(430);robotAt(...position).classList.remove('sparkle')}else{error='Da liegt kein Kristall. Robo muss genau auf einem 💎 stehen.';return}}else if(node.name==='move()'){const [x,y]=position,nx=x+[1,0,-1,0][heading],ny=y+[0,1,0,-1][heading];if(nx<0||nx>=SIZE||ny<0||ny>=SIZE||l.walls.some(([wx,wy])=>wx===nx&&wy===ny)){robotAt(x,y).classList.add('blink');error='Da ist ein Hindernis. Tippe „Neu“ und plane einen anderen Weg.';return}const from=robotAt(x,y),to=robotAt(nx,ny);from.classList.remove('robot');from.innerHTML=l.gems.some(([gx,gy])=>gx===x&&gy===y&&!collected.has(`${x},${y}`))?'💎':'';to.classList.add('robot');to.innerHTML='<span class="robot-piece step">🤖</span>';position=[nx,ny];$('#mission').textContent='Robo läuft los …';await sleep(300)}}}
 await execute(program);if(error){fail('🤔 '+error);$('#mission').textContent='Robo hält an. Passe deinen Code an und probiere es nochmal.'}else if(position[0]===l.goal[0]&&position[1]===l.goal[1]&&collected.size===l.gems.length){done=true;stars++;$('#stars').textContent=stars;safeSet('pythonPathStars',stars);$('#mission').textContent='Robo hat das Ziel erreicht!';$('#notice').textContent='🎉 Geschafft! Du hast einen Stern verdient!';$('#notice').className='notice good show';$('#next').classList.add('show')}else{fail('Robo ist noch nicht am Ziel oder es fehlen Kristalle. Ergänze deinen Code!');$('#mission').textContent='Robo hält an. Ergänze dein Programm und starte es nochmal.'}
 running=false;$('#run').disabled=false;$('#reset').disabled=false}
function robotAt(x,y){return $('#board').children[y*SIZE+x]}
function fail(msg){$('#notice').textContent=msg;$('#notice').className='notice bad show'}
$('#run').onclick=run;$('#reset').onclick=()=>{if(running)return;$('#code').value='';render()};$('#next').onclick=()=>{if(levelIndex<TOTAL-1){levelIndex++;safeSet('pythonPathLevelV2',levelIndex);$('#code').value='';render()}else{$('#title').textContent='Python-Abenteurer!';$('#subtitle').textContent='Alle 100 Missionen geschafft!';$('#notice').textContent='🏆 Python-Meister!';$('#notice').className='notice good show';$('#next').classList.remove('show')}};render();
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
